name: Overdispersion Gate

on:
  workflow_dispatch:
    inputs:
      gameweek:
        description: Replay gameweek
        required: true
        default: "6"
      draws:
        description: Simulation draws
        required: true
        default: "10000"

permissions:
  contents: read
  id-token: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_FUNCTIONS_URL: https://nnoagjayvrwyjtizhnfz.supabase.co/functions/v1
      OIDC_AUDIENCE: tff-fantezi-scout
      GAMEWEEK: ${{ inputs.gameweek }}
      DRAWS: ${{ inputs.draws }}
    steps:
      - name: Request short-lived GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --show-error --silent             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          token="$(printf '%s' "$response" | jq -er '.value')"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Run protected replay distribution gate
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 600             --header "Authorization: Bearer $OIDC_TOKEN"             "$SUPABASE_FUNCTIONS_URL/run-replay-distribution-test?gw=$GAMEWEEK&draws=$DRAWS&seed=20260924&dist=poisson&scale=0&target=secure-overdispersion-gw$GAMEWEEK"
          echo
