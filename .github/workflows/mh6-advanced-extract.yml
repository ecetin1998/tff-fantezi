name: MH6 advanced backfill extract
# Canonical MH6 advanced-data writer. Structured-source validation enabled; parser EOF validated; transient fetch retry enabled.
on:
  push:
    branches: [main]
    paths:
      - "scripts/parse_sahadan_match_stats.py"
      - "supabase/functions/ingest-scout-enrichment/**"
      - "supabase/migrations/20261003023500_advanced_weekly_ledger.sql"
      - ".github/workflows/mh6-advanced-extract.yml"
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  extract:
    runs-on: ubuntu-latest
    env:
      FUNCTIONS_URL: https://nnoagjayvrwyjtizhnfz.supabase.co/functions/v1
      OIDC_AUDIENCE: tff-fantezi-scout
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check beautifulsoup4
      - name: Extract MH6 advanced actions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/parse_sahadan_match_stats.py | tee /tmp/mh6.json
      - name: Mint GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --show-error --silent -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          token="$(printf '%s' "$response" | jq -er '.value')"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Apply MH6 advanced delta
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          jq '{mode:"weekly_delta",season:"2026-27",through_gameweek:6,source:"sahadan_match_actions_gw6_2026-10-03",source_match_count:9,weekly_stats:.rows}' /tmp/mh6.json > /tmp/payload.json
          curl --fail-with-body --show-error --silent --max-time 240 \
            -H "Authorization: Bearer $OIDC_TOKEN" -H "Content-Type: application/json" \
            --data-binary @/tmp/payload.json "$FUNCTIONS_URL/ingest-scout-enrichment" | tee /tmp/result.json
          jq . /tmp/result.json
          test "$(jq -r '.ok // false' /tmp/result.json)" = "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mh6-advanced-actions
          path: |
            /tmp/mh6.json
            /tmp/result.json
