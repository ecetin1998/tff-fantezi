name: Temp Workers lock refresh
on:
  push:
    branches: [tmp/workers-lockgen]
permissions:
  contents: write
jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/workers-lockgen
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh package lock
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit package lock
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lock already current"
          else
            git commit -m "tmp: refresh Workers lockfile"
            git push origin HEAD:tmp/workers-lockgen
          fi
