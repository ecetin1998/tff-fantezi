name: Temp CSS size test
on:
  push:
    branches: [tmp/cssnano-pass]
permissions:
  contents: read
jobs:
  css:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: https://tff-fantezi.ecetin1998.workers.dev
      SCOUT_OFFLINE_BUILD: '1'
      SCOUT_DATA_API_KEY: runtime-test-key-12345678901234567890
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/cssnano-pass
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - name: Build consolidated purged CSS
        shell: bash
        run: |
          cat > scripts/tmp-purge.mjs <<'NODE'
          import fs from 'node:fs'
          import {PurgeCSS} from 'purgecss'
          import postcss from 'postcss'
          import cssnano from 'cssnano'
          import {minify as cssoMinify} from 'csso'
          const files=[
            'components/SiteShell.module.css',
            'components/PremiumViews.module.css',
            'components/SquadWorkspace.module.css',
            'components/AnalysisViews.module.css',
            'components/DataViews.module.css'
          ]
          function unwrapGlobal(input){
            let out='',i=0
            while(i<input.length){
              const start=input.indexOf(':global(',i)
              if(start<0){out+=input.slice(i);break}
              out+=input.slice(i,start)
              let p=start+8,depth=1,q=null,esc=false
              for(;p<input.length;p++){
                const ch=input[p]
                if(q){if(esc)esc=false;else if(ch==='\\\\')esc=true;else if(ch===q)q=null;continue}
                if(ch==='"'||ch==="'"){q=ch;continue}
                if(ch==='(')depth++
                else if(ch===')'&&--depth===0)break
              }
              out+=input.slice(start+8,p)
              i=p+1
            }
            return out
          }
          const raw=files.map(file=>fs.readFileSync(file,'utf8')).join('\n')
          const css=unwrapGlobal(raw).split('.scope').join('')
          fs.writeFileSync('/tmp/all.css',css)
          function walk(dir){
            return fs.readdirSync(dir,{withFileTypes:true}).flatMap(entry=>{
              const full=dir+'/'+entry.name
              return entry.isDirectory()?walk(full):(entry.isFile()&&full.endsWith('.js')?[full]:[])
            })
          }
          const appFiles=walk('app')
          const reachable=new Set(appFiles)
          const queue=[...appFiles]
          while(queue.length){
            const file=queue.pop()
            const source=fs.readFileSync(file,'utf8')
            const imports=[...source.matchAll(/(?:from\s+|import\s*)['"](@\/components\/[^'"]+|\.\.?\/[^'"]+)['"]/g)].map(m=>m[1])
            for(const spec of imports){
              let candidate=null
              if(spec.startsWith('@/components/'))candidate='components/'+spec.slice('@/components/'.length)
              else if(spec.startsWith('.'))candidate=new URL(spec,'file://'+process.cwd()+'/'+file).pathname.slice(process.cwd().length+1)
              if(!candidate)continue
              const variants=[candidate,candidate+'.js',candidate+'/index.js']
              const resolved=variants.find(x=>fs.existsSync(x)&&fs.statSync(x).isFile())
              if(resolved&&!reachable.has(resolved)){reachable.add(resolved);queue.push(resolved)}
            }
          }
          const contentFiles=[...new Set([...reachable].map(file=>file.replaceAll('/../','/')))]
          const stringContent=contentFiles.map(file=>{
            const source=fs.readFileSync(file,'utf8')
            return [...source.matchAll(/["'\`]([^"'\`]{1,1000})["'\`]/g)].map(match=>match[1]).join(' ')
          }).join(' ')
          console.log('purge content files',contentFiles.length,'of',appFiles.length+walk('components').length,'string bytes',Buffer.byteLength(stringContent))
          const result=await new PurgeCSS().purge({
            content:[{raw:stringContent,extension:'html'}],
            css:[{raw:css}],
            safelist:{
              standard:[
                'scope','active','compact','recommended','alternative','warning','critical',
                'good','neutral','tough','high','medium','low','edge','G','B','M',
                'GK','DEF','MID','FWD','is-return','is-emphasis',
                'historical_frozen','live_frozen','reconstructed','preseason_replay',
                'closed','replay_pending','cold_start_gap','bias-up','bias-down',
                /^position-(gk|def|mid|fwd)$/i
              ]
            }
          })
          function compactContainer(container){
            if(!container.nodes)return
            const groupMap=new Map()
            for(const node of [...container.nodes]){
              if(node.type!=='atrule'||!['media','supports','container','layer'].includes(node.name))continue
              const key=node.name+'|'+node.params.replace(/\\s+/g,' ').trim()
              const list=groupMap.get(key)||[]
              list.push(node);groupMap.set(key,list)
            }
            for(const list of groupMap.values()){
              if(list.length<2)continue
              const last=list[list.length-1]
              const merged=[]
              for(const at of list)for(const child of at.nodes||[])merged.push(child.clone())
              last.removeAll()
              for(const child of merged)last.append(child)
              for(const at of list.slice(0,-1))at.remove()
            }

            const ruleMap=new Map()
            for(const node of [...container.nodes]){
              if(node.type!=='rule')continue
              const key=node.selector.replace(/\\s+/g,' ').trim()
              const list=ruleMap.get(key)||[]
              list.push(node);ruleMap.set(key,list)
            }
            for(const list of ruleMap.values()){
              if(list.length<2)continue
              const last=list[list.length-1]
              const chosen=new Set(),chunks=[]
              for(let i=list.length-1;i>=0;i--){
                const rule=list[i]
                const propsInRule=new Set()
                const kept=[]
                for(const node of rule.nodes||[]){
                  if(node.type!=='decl')continue
                  if(chosen.has(node.prop))continue
                  kept.push(node.clone())
                  propsInRule.add(node.prop)
                }
                for(const prop of propsInRule)chosen.add(prop)
                chunks.unshift(kept)
              }
              last.removeAll()
              for(const chunk of chunks)for(const decl of chunk)last.append(decl)
              for(const rule of list.slice(0,-1))rule.remove()
            }
            for(const node of [...(container.nodes||[])])if(node.nodes)compactContainer(node)
          }
          const ast=postcss.parse(result[0].css)
          compactContainer(ast)
          const compacted=ast.toString()
          const optimized=await postcss([cssnano({preset:'default'})]).process(compacted,{from:undefined})
          const restructured=cssoMinify(optimized.css,{restructure:true}).css
          fs.writeFileSync('app/generated.css',restructured)
          console.log('raw css bytes',Buffer.byteLength(raw),'globalized bytes',Buffer.byteLength(css),'purged bytes',Buffer.byteLength(result[0].css),'compacted bytes',Buffer.byteLength(compacted),'optimized bytes',Buffer.byteLength(optimized.css),'csso bytes',Buffer.byteLength(restructured))
          NODE
          node scripts/tmp-purge.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/layout.js')
          s=p.read_text()
          for line in [
            "import siteShell from '@/components/SiteShell.module.css'\n",
            "import premiumViews from '@/components/PremiumViews.module.css'\n",
            "import squadWorkspace from '@/components/SquadWorkspace.module.css'\n",
            "import analysisViews from '@/components/AnalysisViews.module.css'\n",
            "import dataViews from '@/components/DataViews.module.css'\n",
          ]: s=s.replace(line,'')
          s=s.replace("import './globals.css'","import './globals.css'\nimport './generated.css'")
          import re
          s=re.sub(r"const cssScopes=.*?\n","",s)
          s=s.replace('<html lang="tr" className={cssScopes}><body className={cssScopes}>','<html lang="tr"><body>')
          p.write_text(s)
          PY
      - name: Next build
        run: npx next build
      - name: Measure CSS
        run: node scripts/check-css-size.mjs
