name: Probe MH6 source
on:
  push:
    branches: [chore/probe-mh6-source]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch one MH6 player-stats page
        shell: bash
        run: |
          set -euo pipefail
          url='https://www.sahadan.com/mac/corum-fk-vs-alanyaspor/cjb4iy9yti4b15ka3395yxjbo/istatistikler/oyuncu'
          curl -L --compressed -A 'Mozilla/5.0' --max-time 30 -o /tmp/page.html -w 'HTTP=%{http_code} bytes=%{size_download}\n' "$url"
          python3 - <<'PY'
          import json
          from bs4 import BeautifulSoup
          s=open('/tmp/page.html',errors='ignore').read(); soup=BeautifulSoup(s,'html.parser'); x=soup.find('script',id='__NUXT_DATA__'); raw=json.loads(x.string)
          for i,v in enumerate(raw):
              if isinstance(v,dict) and 'type' in v and 'players' in v:
                  print('OBJ',i,v)
          PY
