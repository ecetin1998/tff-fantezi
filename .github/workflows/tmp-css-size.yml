name: Temp CSS size test
on:
  push:
    branches: [tmp/cssnano-pass]
permissions:
  contents: read
jobs:
  css:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: https://tff-fantezi.ecetin1998.workers.dev
      SCOUT_OFFLINE_BUILD: '1'
      SCOUT_DATA_API_KEY: runtime-test-key-12345678901234567890
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/cssnano-pass
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - name: Build consolidated purged CSS
        shell: bash
        run: |
          cat > scripts/tmp-purge.mjs <<'NODE'
          import fs from 'node:fs'
          import {PurgeCSS} from 'purgecss'
          import postcss from 'postcss'
          import cssnano from 'cssnano'
          const files=[
            'components/SiteShell.module.css',
            'components/PremiumViews.module.css',
            'components/SquadWorkspace.module.css',
            'components/AnalysisViews.module.css',
            'components/DataViews.module.css'
          ]
          function unwrapGlobal(input){
            let out='',i=0
            while(i<input.length){
              const start=input.indexOf(':global(',i)
              if(start<0){out+=input.slice(i);break}
              out+=input.slice(i,start)
              let p=start+8,depth=1,q=null,esc=false
              for(;p<input.length;p++){
                const ch=input[p]
                if(q){if(esc)esc=false;else if(ch==='\\\\')esc=true;else if(ch===q)q=null;continue}
                if(ch==='"'||ch==="'"){q=ch;continue}
                if(ch==='(')depth++
                else if(ch===')'&&--depth===0)break
              }
              out+=input.slice(start+8,p)
              i=p+1
            }
            return out
          }
          const raw=files.map(file=>fs.readFileSync(file,'utf8')).join('\n')
          const css=unwrapGlobal(raw).replace(/\\.scope\\b/g,'')
          fs.writeFileSync('/tmp/all.css',css)
          const result=await new PurgeCSS().purge({
            content:['app/**/*.js','components/**/*.js'],
            css:[{raw:css}],
            safelist:{
              standard:[
                'scope','active','compact','recommended','alternative','warning','critical',
                'good','neutral','tough','high','medium','low','edge','G','B','M',
                'GK','DEF','MID','FWD','is-return','is-emphasis',
                'historical_frozen','live_frozen','reconstructed','preseason_replay',
                'closed','replay_pending','cold_start_gap','bias-up','bias-down',
                /^position-(gk|def|mid|fwd)$/i
              ]
            }
          })
          function matchingBrace(s,open){
            let depth=1,quote=null,escaped=false
            for(let i=open+1;i<s.length;i++){
              const ch=s[i]
              if(quote){if(escaped)escaped=false;else if(ch==='\\\\')escaped=true;else if(ch===quote)quote=null;continue}
              if(ch==='"'||ch==="'"){quote=ch;continue}
              if(ch==='{')depth++
              else if(ch==='}'&&--depth===0)return i
            }
            return s.length-1
          }
          function declarations(body){
            const map=new Map(),order=[]
            let start=0,quote=null,depth=0,escaped=false
            for(let i=0;i<=body.length;i++){
              const ch=body[i]||';'
              if(quote){if(escaped)escaped=false;else if(ch==='\\\\')escaped=true;else if(ch===quote)quote=null;continue}
              if(ch==='"'||ch==="'"){quote=ch;continue}
              if(ch==='(')depth++
              else if(ch===')')depth=Math.max(0,depth-1)
              else if(ch===';'&&depth===0){
                const part=body.slice(start,i).trim();start=i+1
                const colon=part.indexOf(':')
                if(colon>0){
                  const prop=part.slice(0,colon).trim(),value=part.slice(colon+1).trim()
                  if(!map.has(prop))order.push(prop)
                  map.set(prop,value)
                }
              }
            }
            return {map,order}
          }
          function compactLevel(input){
            const s=input
            const nodes=[]
            let i=0
            while(i<s.length){
              while(i<s.length&&/\\s/.test(s[i]))i++
              if(i>=s.length)break
              let open=-1,quote=null,escaped=false,semicolon=-1
              for(let j=i;j<s.length;j++){
                const ch=s[j]
                if(quote){if(escaped)escaped=false;else if(ch==='\\\\')escaped=true;else if(ch===quote)quote=null;continue}
                if(ch==='"'||ch==="'"){quote=ch;continue}
                if(ch==='{'){open=j;break}
                if(ch===';'){semicolon=j;break}
              }
              if(semicolon>=0&&(open<0||semicolon<open)){
                nodes.push({type:'raw',raw:s.slice(i,semicolon+1).trim()});i=semicolon+1;continue
              }
              if(open<0){const rest=s.slice(i).trim();if(rest)nodes.push({type:'raw',raw:rest});break}
              const header=s.slice(i,open).trim(),close=matchingBrace(s,open),body=s.slice(open+1,close)
              if(/^@(media|supports|container|layer)\\b/i.test(header))nodes.push({type:'group',header,body})
              else if(/^@/i.test(header))nodes.push({type:'rawblock',header,body})
              else nodes.push({type:'rule',header:header.replace(/\\s+/g,' '),body})
              i=close+1
            }
            const lastRule=new Map(),mergedRule=new Map(),lastGroup=new Map(),groupBodies=new Map()
            nodes.forEach((node,index)=>{
              if(node.type==='rule'){
                lastRule.set(node.header,index)
                const d=declarations(node.body),m=mergedRule.get(node.header)||{map:new Map(),order:[]}
                for(const prop of d.order){if(!m.map.has(prop))m.order.push(prop);m.map.set(prop,d.map.get(prop))}
                mergedRule.set(node.header,m)
              }else if(node.type==='group'){
                const key=node.header.replace(/\\s+/g,' ')
                lastGroup.set(key,index)
                groupBodies.set(key,(groupBodies.get(key)||'')+'\\n'+node.body)
              }
            })
            let out=''
            nodes.forEach((node,index)=>{
              if(node.type==='rule'){
                if(lastRule.get(node.header)!==index)return
                const m=mergedRule.get(node.header)
                out+=node.header+'{'+m.order.map(prop=>prop+':'+m.map.get(prop)).join(';')+'}'
              }else if(node.type==='group'){
                const key=node.header.replace(/\\s+/g,' ')
                if(lastGroup.get(key)!==index)return
                out+=key+'{'+compactLevel(groupBodies.get(key))+'}'
              }else if(node.type==='rawblock')out+=node.header+'{'+node.body+'}'
              else out+=node.raw
            })
            return out
          }
          const compacted=compactLevel(result[0].css)
          const optimized=await postcss([cssnano({preset:'default'})]).process(compacted,{from:undefined})
          fs.writeFileSync('app/generated.css',optimized.css)
          console.log('raw css bytes',Buffer.byteLength(raw),'globalized bytes',Buffer.byteLength(css),'purged bytes',Buffer.byteLength(result[0].css),'compacted bytes',Buffer.byteLength(compacted),'optimized bytes',Buffer.byteLength(optimized.css))
          NODE
          node scripts/tmp-purge.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/layout.js')
          s=p.read_text()
          for line in [
            "import siteShell from '@/components/SiteShell.module.css'\n",
            "import premiumViews from '@/components/PremiumViews.module.css'\n",
            "import squadWorkspace from '@/components/SquadWorkspace.module.css'\n",
            "import analysisViews from '@/components/AnalysisViews.module.css'\n",
            "import dataViews from '@/components/DataViews.module.css'\n",
          ]: s=s.replace(line,'')
          s=s.replace("import './globals.css'","import './globals.css'\nimport './generated.css'")
          import re
          s=re.sub(r"const cssScopes=.*?\n","",s)
          s=s.replace('<html lang="tr" className={cssScopes}><body className={cssScopes}>','<html lang="tr"><body>')
          p.write_text(s)
          PY
      - name: Next build
        run: npx next build
      - name: Measure CSS
        run: node scripts/check-css-size.mjs
