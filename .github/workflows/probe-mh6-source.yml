name: Probe MH6 source
on:
  push:
    branches: [chore/probe-mh6-source]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect embedded MH6 stats payload
        shell: bash
        run: |
          set -euo pipefail
          curl -Ls --compressed -A 'Mozilla/5.0' --max-time 30 'https://www.sahadan.com/mac/corum-fk-vs-alanyaspor/cjb4iy9yti4b15ka3395yxjbo/istatistikler/oyuncu' -o /tmp/page.html
          python3 - <<'PY'
          import re
          s=open('/tmp/page.html',errors='ignore').read()
          for needle in ['Fatih Aksoy','chancesCreated','chances_created','takeons']:
              i=s.lower().find(needle.lower())
              print('\n###',needle,i)
              if i>=0: print(re.sub(r'\\s+',' ',s[max(0,i-1200):i+4500]))
          PY
