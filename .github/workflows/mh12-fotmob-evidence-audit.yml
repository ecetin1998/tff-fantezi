name: MH12 FotMob match evidence audit
on:
  push:
    branches: [main]
    paths: [".github/workflows/mh12-fotmob-evidence-audit.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read nine full-time matches and public player evidence
        run: |
          python3 -m pip install --disable-pip-version-check beautifulsoup4
          PYTHONPATH=scripts python3 - <<'PY'
          import json,time,math
          from pathlib import Path
          from probe_mh8_fotmob_structured import read_json, matches_tff, extract_explicit_stat_values
          from extract_mh8_fotmob_advanced import explicit_attack_metrics
          # Provider candidate IDs from the independently dated match pages.
          fixtures = [
            (5904803,34045,"Trabzonspor","Eyüpspor",1,0),
            (5904804,34042,"Kasımpaşa","Alanyaspor",2,1),
            (5904805,34038,"Başakşehir","Çorum FK",4,2),
            (5904806,34037,"Amed","Rizespor",0,2),
            (5904807,34041,"Gençlerbirliği","Gaziantep",1,0),
            (5904808,34044,"Konyaspor","Beşiktaş",2,4),
            (5904809,34040,"Galatasaray","Samsunspor",2,1),
            (5904810,34043,"Kocaelispor","Fenerbahçe",2,2),
            (5904811,34039,"Erzurumspor","Göztepe",0,1),
          ]
          report=[]
          for i,(provider,internal,home,away,hg,ag) in enumerate(fixtures):
              if i: time.sleep(1.5)
              item={"provider_match_id":provider,"internal_match_candidate":internal,"home":home,"away":away,"score":[hg,ag],"verified":False}
              try:
                  d=read_json(provider)
                  if not matches_tff(d,{"home_team":home,"away_team":away,"home_goals":hg,"away_goals":ag}):
                      raise ValueError("fixture mismatch")
                  c=d.get("content") or {}
                  lineup=c.get("lineup") or {}
                  stats=c.get("playerStats") or {}
                  shotmap=(c.get("shotmap") or {}).get("shots")
                  if not isinstance(shotmap,list): shotmap=None
                  rows=[]
                  for side in ("home","away"):
                      team=lineup.get(side+"Team") or {}
                      if len(team.get("starters") or [])!=11:
                          raise ValueError("missing lineup")
                      for p in (team.get("starters") or [])+(team.get("subs") or []):
                          pid=p.get("id")
                          raw=stats.get(str(pid)) or {}
                          explicit=extract_explicit_stat_values(raw)
                          actions=explicit_attack_metrics(raw)
                          source_stats={}
                          for group in raw.get("stats") or []:
                              for label,stat in (group.get("stats") or {}).items():
                                  if isinstance(stat,dict) and stat.get("key"):
                                      source_stats[stat["key"]]={"label":label,"stat":stat.get("stat"),"value":stat.get("value")}
                          shots=[s for s in shotmap or [] if s.get("playerId")==pid and not s.get("isOwnGoal") and s.get("eventType")!="OwnGoal"]
                          rows.append({"side":side,"shirt":p.get("shirtNumber"),"provider_player_id":pid,"name":p.get("name"),"minutes":explicit.get("minutes_played"),"assists":explicit.get("assists"),"goals":explicit.get("goals"),**actions,"source_stats":source_stats,"shotmap_count":len(shots) if shotmap is not None else None,"shotmap_xg":sum(s["expectedGoals"] for s in shots) if shotmap is not None and all(isinstance(s.get("expectedGoals"),(float,int)) for s in shots) else None})
                  item.update(verified=True,rows=rows,shotmap_count=len(shotmap) if shotmap is not None else None,shotmap=shotmap,match_time=(d.get("general") or {}).get("matchTimeUTC"))
              except Exception as e:
                  item["error"]=str(e)[:200]
              report.append(item)
              print("MH12_EVIDENCE "+json.dumps(item,ensure_ascii=False,separators=(",",":")),flush=True)
          Path("mh12-fotmob-evidence.json").write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print("verified fixtures:",sum(x["verified"] for x in report),"/",len(report))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mh12-fotmob-evidence
          path: mh12-fotmob-evidence.json
          if-no-files-found: error
