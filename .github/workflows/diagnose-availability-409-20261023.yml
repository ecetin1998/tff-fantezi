name: One-time availability 409 diagnostics
on:
  push:
    branches: [main]
    paths: [".github/workflows/diagnose-availability-409-20261023.yml"]
permissions:
  contents: read
  id-token: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect 409 response without mutating stale injury data
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tff-fantezi-scout")"
          token="$(echo "$response" | jq -er '.value')"
          echo "::add-mask::$token"
          status="$(curl --silent --show-error --max-time 45 -o "$RUNNER_TEMP/availability.json" -w '%{http_code}' -H "Authorization: Bearer $token" 'https://nnoagjayvrwyjtizhnfz.supabase.co/functions/v1/refresh-availability')"
          echo "Availability HTTP status: $status"
          jq -c '{error,parsed,matched,ignored:(.ignored//[]|map({source_player,review_reason,inactive_best,best})),critical:(.critical//[]|map({source_player,review_reason,inactive_best,best,active_elsewhere_best})),unmatched_count:(.unmatched|length)}' "$RUNNER_TEMP/availability.json"
          test "$status" = 409 -o "$status" = 200
