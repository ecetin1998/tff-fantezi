name: Post-deploy smoke

on:
  deployment_status:

permissions:
  contents: read
  deployments: read

jobs:
  smoke:
    if: github.event.deployment_status.state == 'success' && (github.event.deployment.production_environment == true || github.event.deployment.environment == 'Production' || github.event.deployment.environment == 'production')
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://tff-fantezi.vercel.app
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - name: Validate deployment URL
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BASE_URL"
          case "$BASE_URL" in
            http://*|https://*) ;;
            *) echo "Invalid deployment URL: $BASE_URL" >&2; exit 1 ;;
          esac
      - name: Smoke deployed revision
        shell: bash
        run: bash scripts/smoke.sh
