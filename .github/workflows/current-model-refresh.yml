name: Current model refresh

on:
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: current-model-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FUNCTIONS_URL: https://nnoagjayvrwyjtizhnfz.supabase.co/functions/v1
      OIDC_AUDIENCE: tff-fantezi-scout

    steps:
      - name: Mint GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --show-error --silent \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          token="$(printf '%s' "$response" | jq -er '.value')"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Refresh upstream inputs
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 240 \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"stage":"ingest","strict":false}' \
            "$FUNCTIONS_URL/model-refresh-control" | jq .

      - name: Resolve current refresh context
        id: context
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          response="$(curl --fail --show-error --silent --max-time 240 \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"stage":"current_context"}' \
            "$FUNCTIONS_URL/model-refresh-control")"
          echo "$response" | jq .
          echo "allowed=$(printf '%s' "$response" | jq -r '.refresh_allowed // false')" >> "$GITHUB_OUTPUT"
          echo "fresh=$(printf '%s' "$response" | jq -r '.source_fresh // false')" >> "$GITHUB_OUTPUT"
          echo "run_id=$(printf '%s' "$response" | jq -r '.run_id // ""')" >> "$GITHUB_OUTPUT"
          echo "gameweek=$(printf '%s' "$response" | jq -r '.gameweek // 0')" >> "$GITHUB_OUTPUT"
          echo "benchmark=$(printf '%s' "$response" | jq -r '.benchmark // ""')" >> "$GITHUB_OUTPUT"

      - name: Skip locked or stale refresh
        if: steps.context.outputs.allowed != 'true' || steps.context.outputs.fresh != 'true'
        run: echo "Current model refresh skipped because kickoff lock is active or availability data is stale."

      - name: Reset simulation accumulator
        if: steps.context.outputs.allowed == 'true' && steps.context.outputs.fresh == 'true'
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          RUN_ID: ${{ steps.context.outputs.run_id }}
          GAMEWEEK: ${{ steps.context.outputs.gameweek }}
          BENCHMARK: ${{ steps.context.outputs.benchmark }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 240 \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            "$FUNCTIONS_URL/run-live-sim-chunk?mode=reset&gw=$GAMEWEEK&run=$RUN_ID&benchmark=$BENCHMARK" | jq .

      - name: Run 50K current simulation
        if: steps.context.outputs.allowed == 'true' && steps.context.outputs.fresh == 'true'
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          RUN_ID: ${{ steps.context.outputs.run_id }}
          GAMEWEEK: ${{ steps.context.outputs.gameweek }}
          BENCHMARK: ${{ steps.context.outputs.benchmark }}
        run: |
          set -euo pipefail
          for part in $(seq 0 24); do
            seed=$((2026000000 + GAMEWEEK * 100000 + part * 2000 + 1))
            echo "Simulation chunk $((part+1))/25"
            curl --fail --show-error --silent --max-time 240 \
              -H "Authorization: Bearer $OIDC_TOKEN" \
              "$FUNCTIONS_URL/run-live-sim-chunk?gw=$GAMEWEEK&run=$RUN_ID&benchmark=$BENCHMARK&draws=2000&seed=$seed" | jq -c .
          done

      - name: Finalize current simulation
        if: steps.context.outputs.allowed == 'true' && steps.context.outputs.fresh == 'true'
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          RUN_ID: ${{ steps.context.outputs.run_id }}
          GAMEWEEK: ${{ steps.context.outputs.gameweek }}
          BENCHMARK: ${{ steps.context.outputs.benchmark }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 240 \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            "$FUNCTIONS_URL/run-live-sim-chunk?mode=finalize&gw=$GAMEWEEK&run=$RUN_ID&benchmark=$BENCHMARK" | jq .

      - name: Refresh recommended squad
        if: steps.context.outputs.allowed == 'true' && steps.context.outputs.fresh == 'true'
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          RUN_ID: ${{ steps.context.outputs.run_id }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 300 \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            "$FUNCTIONS_URL/run-staging-optimizer?mode=recommended&run=$RUN_ID" | jq .

      - name: Refresh ceiling squad
        if: steps.context.outputs.allowed == 'true' && steps.context.outputs.fresh == 'true'
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          RUN_ID: ${{ steps.context.outputs.run_id }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 300 \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            "$FUNCTIONS_URL/run-staging-optimizer?mode=alternative&run=$RUN_ID" | jq .

      - name: Re-run model gates
        if: steps.context.outputs.allowed == 'true' && steps.context.outputs.fresh == 'true'
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          RUN_ID: ${{ steps.context.outputs.run_id }}
        run: |
          set -euo pipefail
          for stage in qa integrity bugfix; do
            jq -n --arg stage "$stage" --arg run "$RUN_ID" '{stage:$stage,run_id:$run}' | \
              curl --fail --show-error --silent \
                -H "Authorization: Bearer $OIDC_TOKEN" \
                -H "Content-Type: application/json" \
                --data-binary @- \
                "$FUNCTIONS_URL/model-refresh-control" | jq .
          done

      - name: Refresh frozen live snapshot
        if: steps.context.outputs.allowed == 'true' && steps.context.outputs.fresh == 'true'
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          RUN_ID: ${{ steps.context.outputs.run_id }}
        run: |
          set -euo pipefail
          jq -n --arg run "$RUN_ID" '{action:"snapshot",run_id:$run}' | \
            curl --fail --show-error --silent \
              -H "Authorization: Bearer $OIDC_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @- \
              "$FUNCTIONS_URL/weekly-model-lifecycle" | jq .
