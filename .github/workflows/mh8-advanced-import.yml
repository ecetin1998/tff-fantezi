name: Import verified MH8 attack evidence for MH9

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mh8-advanced-import.yml"
      - "supabase/functions/ingest-scout-enrichment/index.ts"
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: mh8-verified-attack-import
  cancel-in-progress: false

jobs:
  verified_import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FUNCTIONS_URL: https://nnoagjayvrwyjtizhnfz.supabase.co/functions/v1
      OIDC_AUDIENCE: tff-fantezi-scout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source reader
        run: python3 -m pip install --disable-pip-version-check beautifulsoup4
      - name: Validate MH8 source parser and null safety
        run: python3 -m unittest discover -s test -p mh8_advanced_source_test.py -v
      - name: Fetch and verify nine MH8 full-time advanced match pages
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/extract_mh8_fotmob_advanced.py --output "$RUNNER_TEMP/mh8-source.json"
          jq -e '.kind == "READ_ONLY_VERIFIED_MH8_ADVANCED_ACTIONS" and
            .gameweek == 8 and .season == "2026-27" and
            .verified_fixtures == 9 and .matched_played == 286 and
            .unmatched_played == 0 and .db_writes == 0 and
            .fantasy_points_written == 0 and (.rows | length) == 286 and
            .metric_coverage.xg >= 100 and .metric_coverage.xa >= 100' "$RUNNER_TEMP/mh8-source.json"
      - name: Mint GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          token="$(printf '%s' "$response" | jq -er '.value')"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Import immutable, sparse per-player MH8 observed attack facts
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          jq -n --slurpfile audit "$RUNNER_TEMP/mh8-source.json" \
            '$audit[0] | {mode:"verified_gw8_attack",season,through_gameweek:.gameweek,kind,verified_fixtures,matched_played,unmatched_played,db_writes,fantasy_points_written,metric_coverage,source,rows}' \
            > "$RUNNER_TEMP/mh8-import-payload.json"
          curl --fail-with-body --silent --show-error --max-time 240 \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/mh8-import-payload.json" \
            "$FUNCTIONS_URL/ingest-scout-enrichment" > "$RUNNER_TEMP/mh8-import-result.json"
          jq . "$RUNNER_TEMP/mh8-import-result.json"
          jq -e '.ok == true and .mode == "verified_gw8_attack" and
            .matched == 286 and .no_fantasy_writes == true and
            .counts.xg >= 100 and .counts.xa >= 100' "$RUNNER_TEMP/mh8-import-result.json"
      - name: Trigger guarded MH9 50K refresh from verified new source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run weekly-model-lifecycle.yml --ref main
          echo "Verified MH8 source ingested. Triggered independently gated MH9 50K refresh." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mh8-import-audit
          path: |
            ${{ runner.temp }}/mh8-source.json
            ${{ runner.temp }}/mh8-import-result.json
          if-no-files-found: ignore
