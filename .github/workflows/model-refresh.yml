name: Model refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 */6 * * 4-5'

permissions:
  contents: read
  id-token: write

env:
  SUPABASE_FUNCTIONS_URL: https://nnoagjayvrwyjtizhnfz.supabase.co/functions/v1
  OIDC_AUDIENCE: tff-fantezi-scout

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.candidate.outputs.run_id }}
      gameweek: ${{ steps.candidate.outputs.gameweek }}
    steps:
      - uses: actions/checkout@v4
      - name: Acquire GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          token="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Ingest / source freshness
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          curl -fsS -X POST "$SUPABASE_FUNCTIONS_URL/model-refresh-control"             -H "Authorization: Bearer $OIDC_TOKEN" -H 'Content-Type: application/json'             --data '{"stage":"ingest"}' | tee /tmp/ingest.json
      - name: Select candidate run
        id: candidate
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          curl -fsS -X POST "$SUPABASE_FUNCTIONS_URL/model-refresh-control"             -H "Authorization: Bearer $OIDC_TOKEN" -H 'Content-Type: application/json'             --data '{"stage":"candidate"}' > /tmp/candidate.json
          cat /tmp/candidate.json
          echo "run_id=$(python3 -c 'import json;print(json.load(open("/tmp/candidate.json"))["run_id"])')" >> "$GITHUB_OUTPUT"
          echo "gameweek=$(python3 -c 'import json;print(json.load(open("/tmp/candidate.json"))["gameweek"])')" >> "$GITHUB_OUTPUT"
      - name: Candidate optimizer — recommended
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          RUN_ID: ${{ steps.candidate.outputs.run_id }}
        run: curl -fsS "$SUPABASE_FUNCTIONS_URL/run-staging-optimizer?mode=recommended&run=$RUN_ID" -H "Authorization: Bearer $OIDC_TOKEN"
      - name: Candidate optimizer — alternative
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          RUN_ID: ${{ steps.candidate.outputs.run_id }}
        run: curl -fsS "$SUPABASE_FUNCTIONS_URL/run-staging-optimizer?mode=alternative&run=$RUN_ID" -H "Authorization: Bearer $OIDC_TOKEN"
      - name: Model QA
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          RUN_ID: ${{ steps.candidate.outputs.run_id }}
        run: |
          curl -fsS -X POST "$SUPABASE_FUNCTIONS_URL/model-refresh-control"             -H "Authorization: Bearer $OIDC_TOKEN" -H 'Content-Type: application/json'             --data "{"stage":"qa","run_id":"$RUN_ID"}"
      - name: Data integrity QA
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          RUN_ID: ${{ steps.candidate.outputs.run_id }}
        run: |
          curl -fsS -X POST "$SUPABASE_FUNCTIONS_URL/model-refresh-control"             -H "Authorization: Bearer $OIDC_TOKEN" -H 'Content-Type: application/json'             --data "{"stage":"integrity","run_id":"$RUN_ID"}"
      - name: Replay
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          GW: ${{ steps.candidate.outputs.gameweek }}
        shell: bash
        run: |
          replay_gw=$(( GW > 1 ? GW - 1 : 1 ))
          curl -fsS "$SUPABASE_FUNCTIONS_URL/run-replay-distribution-test?gw=$replay_gw&draws=50000&target=scheduled-refresh-${GITHUB_SHA::12}"             -H "Authorization: Bearer $OIDC_TOKEN" | tee /tmp/replay.json
      - name: Record replay PASS
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          RUN_ID: ${{ steps.candidate.outputs.run_id }}
        run: |
          details="$(python3 -c 'import json;print(json.dumps(json.load(open("/tmp/replay.json")),separators=(",",":")))' | python3 -c 'import json,sys;print(json.dumps({"stage":"replay","run_id":sys.argv[1],"pass":True,"details":json.loads(sys.stdin.read())}))' "$RUN_ID")"
          curl -fsS -X POST "$SUPABASE_FUNCTIONS_URL/model-refresh-control"             -H "Authorization: Bearer $OIDC_TOKEN" -H 'Content-Type: application/json' --data "$details"

  promote:
    if: github.event_name == 'workflow_dispatch'
    needs: refresh
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Acquire GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          response="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tff-fantezi-scout")"
          token="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Promote candidate
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          RUN_ID: ${{ needs.refresh.outputs.run_id }}
        run: |
          curl -fsS -X POST "https://nnoagjayvrwyjtizhnfz.supabase.co/functions/v1/model-refresh-control"             -H "Authorization: Bearer $OIDC_TOKEN" -H 'Content-Type: application/json'             --data "{"stage":"promote","run_id":"$RUN_ID"}"
