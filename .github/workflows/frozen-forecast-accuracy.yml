name: Frozen forecast accuracy (read-only)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/frozen-forecast-accuracy.yml"
      - "supabase/functions/weekly-model-lifecycle/frozenAccuracy.mjs"
  workflow_dispatch:
  schedule:
    # 11:45 Turkish time every Monday; only CLOSED historical weeks are read.
    - cron: '45 8 * * 1'
permissions:
  contents: read
  id-token: write
concurrency:
  group: frozen-forecast-accuracy
  cancel-in-progress: false
jobs:
  accuracy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FUNCTIONS_URL: https://nnoagjayvrwyjtizhnfz.supabase.co/functions/v1
      OIDC_AUDIENCE: tff-fantezi-scout
    steps:
      - name: Mint trusted GitHub identity
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --show-error --silent -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          token="$(printf '%s' "$response" | jq -er '.value')"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Evaluate closed pre-kickoff predictions only
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"action":"diagnose_backtest"}' \
            "$FUNCTIONS_URL/weekly-model-lifecycle" > frozen-accuracy.json
          jq -e '.ok == true and .no_writes == true and .auto_tuning_permitted == false and .source == "immutable_pre_kickoff_live_frozen" and .primary_learning_cohort == "ex_ante" and (.learning_cohorts.ex_ante.n > 0) and .learning_guardrails.zero_without_source_is_unverified == true and .learning_guardrails.reconstructed_zero_minutes_is_unverified == true' frozen-accuracy.json
          {
            echo "### Immutable pre-kickoff model accuracy"
            jq -r '"Closed weeks: " + (.closed_weeks | map(tostring) | join(", "))' frozen-accuracy.json
            echo ""
            echo "| Metric | Value |"
            echo "|---|---:|"
            jq -r '
              "| Expected active (pre-match 30+ min) | " + (.learning_cohorts.ex_ante.n|tostring) + " |",
              "| **PRIMARY** ex-ante FP MAE | **" + (.learning_cohorts.ex_ante.fp_mae|tostring) + "** |",
              "| PRIMARY ex-ante minutes MAE | " + (.learning_cohorts.ex_ante.minute_mae|tostring) + " |",
              "| PRIMARY ex-ante 6+ Brier | " + (.learning_cohorts.ex_ante.six_plus_brier|tostring) + " |",
              "| Played or expected 30+ minutes | " + (.learning_cohorts.actionable.n|tostring) + " |",
              "| Active union FP MAE (diagnostic) | " + (.learning_cohorts.actionable.fp_mae|tostring) + " |",
              "| Missed 60+ minute starters | " + (.learning_cohorts.surprise_starters.n // 0|tostring) + " |",
              "| Trivial predicted <15 min, actual 0/0 | " + (.evidence_quality.low_attention_zero_zero|tostring) + " |",
              "| Imputed 0/0 with NO source | " + (.evidence_quality.imputed_zero_without_source|tostring) + " |",
              "| Reconstructed, unconfirmed 0/0 | " + (.evidence_quality.inferred_zero_from_events|tostring) + " |",
              "| Legacy all-player FP MAE (NOT training) | " + (.overall.fp_mae|tostring) + " |"' frozen-accuracy.json
            echo ""
            echo "### Active cohort by position"
            echo "| Position | Sample | FP MAE | Minute MAE |"
            echo "|---|---:|---:|---:|"
            jq -r '.learning_by_position | to_entries[] | "| " + (.key | split(":")[-1]) + " | " + (.value.n|tostring) + " | " + (.value.fp_mae|tostring) + " | " + (.value.minute_mae|tostring) + " |"' frozen-accuracy.json
            echo ""
            echo "Primary cohort is defined BEFORE kickoff by expected minutes >= 30, with source-supported actuals. Realized-play and surprise-starter cohorts are diagnostic, not a hindsight selection rule."
            echo "0/0 records without sourced evidence or with inferred absence are excluded from the primary learning objective."
            echo "No automatic tuning; candidate changes require forward holdout before promotion."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-backtest-accuracy
          path: frozen-accuracy.json
          retention-days: 60
