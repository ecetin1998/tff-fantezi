name: Temporary package-lock repair

on:
  workflow_dispatch:
  push:
    branches: [fix/full-audit-cloudflare-v2]
    paths:
      - package.json
      - .github/workflows/package-lock-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Regenerate package lock'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-audit-cloudflare-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated lock
        shell: bash
        run: |
          if git diff --quiet package-lock.json; then
            echo "Lock already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Regenerate package lock"
          git push origin HEAD:fix/full-audit-cloudflare-v2
