name: Generate Sentry lockfile
on:
  push:
    branches: ['tmp/sentry-lock']
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install @sentry/nextjs --save-exact --no-audit --no-fund
      - name: Commit generated lockfile
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: pin sentry nextjs"
          git push origin HEAD:tmp/sentry-lock
      - uses: actions/upload-artifact@v4
        with:
          name: sentry-lockfile
          path: |
            package.json
            package-lock.json
