name: Verify live site week matches public API (read-only)

on:
  workflow_run:
    workflows: ["Cloudflare Workers deploy"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/mh8-live-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-live-model-week
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check production health and resolve active model week
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://fanteziligrehberi.com"
          curl --fail --silent --show-error --location --max-time 45 \
            --retry 3 --retry-delay 2 --retry-all-errors \
            -H 'Cache-Control: no-cache' "$BASE/api/health" | jq -e '.ok == true'
          api="$(curl --fail --silent --show-error --location --max-time 45 \
            --retry 3 --retry-delay 2 --retry-all-errors \
            -H 'Cache-Control: no-cache' "$BASE/api/scout-data?section=matches")"
          printf '%s' "$api" | jq -e \
            '.current_run.is_current == true and .current_run.status == "ready" and (.matches | length) == 9'
          echo "EXPECTED_GAMEWEEK=$(printf '%s' "$api" | jq -er '.current_run.gameweek')" >> "$GITHUB_ENV"
      - name: Verify React SSR page headings against the published gameweek
        # Share the release verifier instead of stripping HTML tags with regex:
        # React 19 fragments MH<!-- -->8<!-- --> into text nodes, which the
        # previous standalone probe incorrectly interpreted as "MH 8".
        # This check is read-only and does NOT deploy Cloudflare.
        run: bash scripts/verify-published-gameweek.sh
