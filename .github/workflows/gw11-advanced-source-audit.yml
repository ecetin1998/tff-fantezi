name: MH11 advanced source audit (read only)
on:
  push:
    branches: [fix/advanced-coverage-truth-and-denominators]
    paths:
      - scripts/audit_gw11_advanced_sources.py
      - scripts/reconcile_gw11_verified_advanced.py
      - data/source-evidence/gw11-scout-verified-player-identity.json
      - data/source-evidence/gw11-reviewed-provider-name-truncations.json
      - test/gw11_source_player_crosswalk_test.py
      - test/gw11_advanced_source_audit_test.py
      - data/source-evidence/gw11-advanced-provider-candidates.json
      - .github/workflows/gw11-advanced-source-audit.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source reader
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Source identity, kickoff and no-leakage tests
        run: python -m unittest discover -s test -p gw11_advanced_source_audit_test.py -v
      - name: Audit all nine fixtures against final provider API
        run: |
          python scripts/audit_gw11_advanced_sources.py --output gw11-advanced-audit.json
          jq -r '"MH11 matches independently verified: \(.verified_fixtures)/9; safe source import=\(.safe_to_import_advanced)"' gw11-advanced-audit.json >> "$GITHUB_STEP_SUMMARY"
          jq -e '.verified_fixtures == 9 and .safe_to_import_advanced == true and .db_writes==0 and .fantasy_points_written==0' gw11-advanced-audit.json
      - name: Reconcile explicit MH11 player attack stats (read only)
        run: |
          python -m unittest discover -s test -p gw11_source_player_crosswalk_test.py -v
          python scripts/reconcile_gw11_verified_advanced.py --output gw11-player-advanced-staging.json
          jq -r '"MH11 source-matched: \(.matched_played)/\(.expected_played); zero min excluded=\(.zero_minute_rows_kept_out)"' gw11-player-advanced-staging.json >> "$GITHUB_STEP_SUMMARY"
          jq -e '.ready_for_review == true and .verified_fixtures == 9 and .matched_played == .expected_played and .db_writes==0' gw11-player-advanced-staging.json
      - name: Preserve independently matched MH11 observations for review
        if: ${{ always() && github.ref_name == 'fix/advanced-coverage-truth-and-denominators' }}
        run: |
          if [ ! -s gw11-player-advanced-staging.json ]; then exit 0; fi
          if ! jq -e '.verified_fixtures==9 and .matched_played>=260 and .db_writes==0' gw11-player-advanced-staging.json; then exit 0; fi
          cp gw11-player-advanced-staging.json data/source-evidence/gw11-player-advanced-staging-observed.json
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/source-evidence/gw11-player-advanced-staging-observed.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(source): record verified MH11 observed advanced player facts; preserve 1 missing"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mh11-advanced-source-audit
          path: |
            gw11-advanced-audit.json
            gw11-player-advanced-staging.json
          if-no-files-found: ignore
