name: MH10 advanced source audit (read only)
on:
  push:
    branches: [fix/advanced-coverage-truth-and-denominators]
    paths:
      - scripts/audit_gw11_advanced_sources.py
      - scripts/reconcile_gw11_verified_advanced.py
      - data/source-evidence/gw10-advanced-provider-candidates.json
      - data/source-evidence/gw10-scout-verified-player-identity.json
      - data/source-evidence/gw10-reviewed-provider-name-truncations.json
      - .github/workflows/gw10-advanced-source-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source reader
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Verify 9 MH10 fixtures and nullable player advanced metrics
        run: |
          python -m unittest discover -s test -p gw11_advanced_source_audit_test.py -v
          python scripts/audit_gw11_advanced_sources.py --manifest data/source-evidence/gw10-advanced-provider-candidates.json --output gw10-source-fixtures.json
          jq -e '.verified_fixtures==9 and .db_writes==0 and .fantasy_points_written==0' gw10-source-fixtures.json
      - name: Reconcile 284 positive-minute players (without guessing zeroes)
        run: |
          python -m unittest discover -s test -p gw11_source_player_crosswalk_test.py -v
          python scripts/reconcile_gw11_verified_advanced.py \
            --fixtures data/source-evidence/gw10-advanced-provider-candidates.json \
            --roster data/source-evidence/gw10-scout-verified-player-identity.json \
            --output gw10-advanced-staging.json
          jq -r '"MH10 source-matched: \(.matched_played)/\(.expected_played), 0-min excluded: \(.zero_minute_rows_kept_out)"' gw10-advanced-staging.json >> "$GITHUB_STEP_SUMMARY"
          jq -e '.ready_for_review == true and .verified_fixtures == 9 and .matched_played == .expected_played and .db_writes==0' gw10-advanced-staging.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mh10-advanced-source-audit
          path: |
            gw10-source-fixtures.json
            gw10-advanced-staging.json
          if-no-files-found: ignore
