name: Cloudflare Workers deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SITE_URL: https://fanteziligrehberi.com
      NEXT_PUBLIC_SUPABASE_REDIRECT_URL: https://fanteziligrehberi.com/auth/confirm
      NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
      BASE_URL: https://fanteziligrehberi.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Cloudflare credentials are configured
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Python test dependencies
        run: python3 -m pip install --disable-pip-version-check pytest
      - name: Quality gate
        run: |
          npm run lint
          npm test
      - name: Install Cloudflare build tooling
        run: npm install --no-save --package-lock=false @opennextjs/cloudflare@1.20.6 wrangler@4.142.0 @opentelemetry/api@1.9.0
      - name: Ensure OpenNext KV namespace
        shell: bash
        run: |
          set -euo pipefail
          KV_ID="$(npx wrangler kv namespace list | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s);const x=a.find(v=>String(v.title||'').endsWith('NEXT_INC_CACHE_KV'));if(x)process.stdout.write(x.id)})")"
          if [ -z "$KV_ID" ]; then
            npx wrangler kv namespace create NEXT_INC_CACHE_KV --update-config
          else
            KV_ID="$KV_ID" node -e "const fs=require('fs');const p='wrangler.jsonc';let s=fs.readFileSync(p,'utf8');s=s.replace('AUTO_CONFIGURED_BY_CI',process.env.KV_ID);fs.writeFileSync(p,s)"
          fi
        env:
          KV_ID: ${{ env.KV_ID }}
      - name: Deploy
        run: npm run deploy
      - name: Verify deployed commit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            remote_sha="$(curl -fsSL "$BASE_URL/api/health" | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).sha" || true)"
            if [ "$remote_sha" = "$GITHUB_SHA" ]; then
              echo "Deployed SHA verified: $remote_sha"
              exit 0
            fi
            echo "Waiting for SHA $GITHUB_SHA; live=$remote_sha"
            sleep 5
          done
          exit 1
      - name: Production smoke
        run: SKIP_CDN_CHECK=1 bash scripts/smoke.sh
