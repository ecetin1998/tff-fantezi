name: GW7 match-level tactical lineup audit (read-only)
on:
  pull_request:
    paths:
      - scripts/audit_gw7_tactical_layout.py
      - test/gw7_tactical_layout_test.py
      - .github/workflows/gw7-tactical-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source reader
        run: python3 -m pip install --disable-pip-version-check beautifulsoup4
      - name: Verify source fixtures and identities test
        run: python3 -m unittest discover -s test -p gw7_tactical_layout_test.py -v
      - name: Fetch verified MH7 full-time tactical geometry
        run: |
          python3 scripts/audit_gw7_tactical_layout.py --output "$RUNNER_TEMP/gw7-role-evidence.json"
          jq -e '.kind == "READ_ONLY_VERIFIED_MH7_LINEUP_COORDINATES" and
            .gameweek == 7 and .db_writes == 0 and .fantasy_points_written == 0' "$RUNNER_TEMP/gw7-role-evidence.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mh7-tactical-geometry-audit
          path: ${{ runner.temp }}/gw7-role-evidence.json
          if-no-files-found: ignore
