name: Pro promo capture 2026-10-02

on:
  push:
    branches:
      - chore/pro-promo-tour-20261002

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      PROMO_CAPTURE_PRO: "1"
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app and browser
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Prepare isolated Pro preview
        run: |
          node <<'EOF'
          const fs=require('fs');

          let data=fs.readFileSync('lib/data.js','utf8');
          const authNeedle="export async function getAuthState() {\n  const supabase = await createServerClient()";
          if(!data.includes(authNeedle)) throw new Error('getAuthState insertion point not found');
          data=data.replace(authNeedle,
            "export async function getAuthState() {\n  if(process.env.PROMO_CAPTURE_PRO==='1') return { userId:null, email:null, plan:'pro', tier:'pro', signedIn:false }\n  const supabase = await createServerClient()");
          fs.writeFileSync('lib/data.js',data);

          let squad=fs.readFileSync('app/squad/page.js','utf8');
          squad=squad.replace("  if(!auth.userId)return <div className=\"auth-wrap\"><div className=\"card auth-card squad-login-card\">",
            "  const promoCapture=process.env.PROMO_CAPTURE_PRO==='1'\n  if(!auth.userId&&!promoCapture)return <div className=\"auth-wrap\"><div className=\"card auth-card squad-login-card\">");
          squad=squad.replace(
            "  const {data:pageData,error:pageError}=run?.gameweek\n    ?await supabase.rpc('scout_my_squad_page',{p_gameweek:run.gameweek})\n    :{data:null,error:null}",
            "  const {data:pageData,error:pageError}=promoCapture\n    ?{data:{gameweek:null,snapshots:[],members:[],points:[],players:[]},error:null}\n    :run?.gameweek\n      ?await supabase.rpc('scout_my_squad_page',{p_gameweek:run.gameweek})\n      :{data:null,error:null}"
          );
          squad=squad.replace(
            "  const recommendedState=(recommended||[]).map(x=>({player_id:Number(x.player_id),is_captain:Boolean(x.is_captain),bench_order:x.squad_slot==='XI'?null:(++recommendedBenchOrder)}))",
            "  const recommendedState=(recommended||[]).map(x=>({player_id:Number(x.player_id),is_captain:Boolean(x.is_captain),bench_order:x.squad_slot==='XI'?null:(++recommendedBenchOrder)}))\n  if(promoCapture)initialState=recommendedState"
          );
          fs.writeFileSync('app/squad/page.js',squad);
          EOF

      - name: Start local current site
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/promo-next.log 2>&1 &
          echo $! > /tmp/promo-next.pid
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/promo-next.log
          exit 1

      - name: Record weighted Pro product tour
        run: |
          mkdir -p promo-pro/screens promo-pro/video
          cat > promo-tour.mjs <<'EOF'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';

          const base='http://127.0.0.1:3000';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({
            viewport:{width:1440,height:900},
            deviceScaleFactor:1,
            recordVideo:{dir:'promo-pro/video',size:{width:1440,height:900}},
          });
          const page=await context.newPage();

          async function goto(route,wait=1400){
            await page.goto(base+route,{waitUntil:'networkidle',timeout:45000});
            await page.waitForTimeout(wait);
          }
          async function shot(name){
            await page.screenshot({path:path.join('promo-pro/screens',name+'.png'),fullPage:false});
          }
          async function scroll(y,duration=1200){
            await page.evaluate(async ({y,duration})=>{
              const start=window.scrollY,t0=performance.now();
              await new Promise(resolve=>{
                function step(t){
                  const p=Math.min(1,(t-t0)/duration);
                  const e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
                  window.scrollTo(0,start+y*e);
                  if(p<1)requestAnimationFrame(step);else resolve();
                }
                requestAnimationFrame(step);
              });
            },{y,duration});
            await page.waitForTimeout(500);
          }

          // 1) Ana Sayfa — kısa marka açılışı.
          await goto('/',2200); await shot('01-home'); await scroll(520,1300); await page.waitForTimeout(800);

          // 2) Oyuncu Analizi — videonun en uzun ürün bölümü.
          await goto('/players',2200); await shot('02-players'); await scroll(420,1200); await page.waitForTimeout(900);
          const playerHref=await page.locator('a[href^="/players/"]').evaluateAll(els=>els.map(e=>e.getAttribute('href')).find(Boolean)||null);
          if(playerHref){ await goto(playerHref,1500); await shot('03-player-detail'); await scroll(520,1200); await page.waitForTimeout(900); }

          // 3) Fantezi Puanları.
          await goto('/points',1500); await shot('04-points'); await scroll(350,900);

          // 4) Maç Tahminleri — ana karar ekranlarından biri.
          await goto('/matches',2200); await shot('05-matches'); await scroll(600,1400); await page.waitForTimeout(1100);

          // 5) Kadro Önerileri — Pro: önerilen + agresif + menajer kartları.
          await goto('/squads',2600); await shot('06-squads'); await scroll(680,1500); await page.waitForTimeout(1100); await scroll(620,1200); await page.waitForTimeout(800);

          // 6) Benim Kadrom — Pro menajer kartları ve saha.
          await goto('/squad',3000); await shot('07-my-squad'); await scroll(560,1300); await page.waitForTimeout(1100); await scroll(520,1100); await page.waitForTimeout(700);

          // 7) Takım Analizi + detay.
          await goto('/teams',2000); await shot('08-teams'); await scroll(480,1100); await page.waitForTimeout(700);
          const teamHref=await page.locator('a[href^="/teams/"]').evaluateAll(els=>els.map(e=>e.getAttribute('href')).find(Boolean)||null);
          if(teamHref){ await goto(teamHref,1200); await shot('09-team-detail'); await scroll(450,1000); await page.waitForTimeout(600); }

          // 8) Yardımcı karar ekranları — daha kısa.
          await goto('/availability',1400); await shot('10-availability'); await scroll(320,800);
          await goto('/roles',1400); await shot('11-roles'); await scroll(320,800);
          await goto('/backtest',1400); await shot('12-backtest'); await scroll(320,800);
          await goto('/model-health',1200); await shot('13-model-health'); await scroll(250,700);
          await goto('/pricing',1200); await shot('14-pricing'); await page.waitForTimeout(800);
          await goto('/sss',1000); await shot('15-sss'); await scroll(300,700);

          // Kapanış.
          await goto('/',1000); await page.waitForTimeout(900);

          await context.close();
          await browser.close();

          const vids=fs.readdirSync('promo-pro/video').filter(x=>x.endsWith('.webm'));
          if(vids.length)fs.renameSync(path.join('promo-pro/video',vids[0]),'promo-pro/pro-tour.webm');
          EOF
          node promo-tour.mjs

      - name: Upload Pro capture
        uses: actions/upload-artifact@v4
        with:
          name: fantezi-rehberi-pro-capture-20261002
          path: promo-pro
          retention-days: 3
