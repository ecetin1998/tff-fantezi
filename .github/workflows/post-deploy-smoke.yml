name: Post-deploy smoke

on:
  workflow_run:
    workflows: ["Cloudflare Workers deploy"]
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://tff-fantezi.ecetin1998.workers.dev
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Verify live SHA is main deployment SHA
        shell: bash
        run: |
          set -euo pipefail
          live_sha="$(curl -fsSL "$BASE_URL/api/health" | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).sha")"
          test "$live_sha" = "$EXPECTED_SHA" || {
            echo "Live SHA $live_sha does not match expected $EXPECTED_SHA" >&2
            exit 1
          }
      - name: Smoke Workers production
        run: SKIP_CDN_CHECK=1 bash scripts/smoke.sh
