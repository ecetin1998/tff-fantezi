name: Deploy Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SITE_URL: https://tff-fantezi.ecetin1998.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Sync Worker secrets
        shell: bash
        env:
          SCOUT_DATA_API_KEY: ${{ secrets.SCOUT_DATA_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set -euo pipefail
          if [[ -n "${SCOUT_DATA_API_KEY:-}" ]]; then
            printf '%s' "$SCOUT_DATA_API_KEY" | npx wrangler secret put SCOUT_DATA_API_KEY
          else
            echo "SCOUT_DATA_API_KEY GitHub secret is not configured; existing Worker secret is left unchanged."
          fi
          if [[ -n "${SENTRY_DSN:-}" ]]; then
            printf '%s' "$SENTRY_DSN" | npx wrangler secret put SENTRY_DSN
          else
            echo "SENTRY_DSN GitHub secret is not configured; console fallback remains active."
          fi
      - name: Production build
        run: npm run build
      - name: Deploy
        run: npm run deploy
      - name: Production smoke
        env:
          BASE_URL: https://tff-fantezi.ecetin1998.workers.dev
        run: bash scripts/smoke.sh
