name: Deploy Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SITE_URL: https://tff-fantezi.ecetin1998.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Ensure R2 incremental cache bucket
        shell: bash
        run: |
          set -euo pipefail
          if ! npx wrangler r2 bucket list | grep -q 'tff-fantezi-next-inc-cache'; then
            npx wrangler r2 bucket create tff-fantezi-next-inc-cache
          fi

      - name: Ensure D1 tag cache schema
        run: npx wrangler d1 execute tff-fantezi-next-tag-cache --remote --file=cloudflare/d1-tag-cache.sql

      - name: Sync Worker secrets
        shell: bash
        env:
          SCOUT_DATA_API_KEY: ${{ secrets.SCOUT_DATA_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set -euo pipefail
          if [[ -n "${SCOUT_DATA_API_KEY:-}" ]]; then
            printf '%s' "$SCOUT_DATA_API_KEY" | npx wrangler secret put SCOUT_DATA_API_KEY
          else
            echo "SCOUT_DATA_API_KEY GitHub secret is not configured; existing Worker secret is left unchanged."
          fi
          if [[ -n "${SENTRY_DSN:-}" ]]; then
            printf '%s' "$SENTRY_DSN" | npx wrangler secret put SENTRY_DSN
          else
            echo "SENTRY_DSN GitHub secret is not configured; console fallback remains active."
          fi

      - name: Deploy
        run: npm run deploy

      - name: Production smoke
        env:
          BASE_URL: https://tff-fantezi.ecetin1998.workers.dev
        run: bash scripts/smoke.sh
