name: Model v2 Replay Evidence

on:
  push:
    branches: [fix/model-engine-v2]
    paths:
      - '.github/workflows/model-v2-replay.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  replay:
    name: GW${{ matrix.gameweek }} 50K replay
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        gameweek: [1,2,3,4,5,6]
    env:
      FUNCTIONS_URL: https://nnoagjayvrwyjtizhnfz.supabase.co/functions/v1
      OIDC_AUDIENCE: tff-fantezi-scout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch protected replay input
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --show-error --silent             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          token="$(printf '%s' "$response" | jq -er '.value')"
          echo "::add-mask::$token"
          curl --fail --show-error --silent --max-time 90             --header "Authorization: Bearer $token"             "${FUNCTIONS_URL}/model-replay-input?gw=${{ matrix.gameweek }}"             -o replay-input.json
          jq -e '.players|length>0' replay-input.json >/dev/null
      - name: Run 50K candidate replay
        shell: bash
        run: |
          set -euo pipefail
          node model/runReplayEvidence.js replay-input.json replay-result.json 50000 $((20260927 + ${{ matrix.gameweek }} * 1000))
          cat replay-result.json
