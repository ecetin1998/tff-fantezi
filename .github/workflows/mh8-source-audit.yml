name: MH8 public match source coverage (read-only)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mh8-source-audit.yml"
      - "scripts/audit_mh8_fotmob_sources.py"
      - "scripts/probe_mh8_fotmob_structured.py"
      - "scripts/reconcile_mh8_provider_players.py"
      - "scripts/stage_mh8_observed_player_metrics.py"
      - "scripts/stage_mh8_event_adjudication.py"
      - "scripts/stage_mh8_point_components.py"
      - "test/mh8_point_components_test.py"
      - "test/mh8_event_adjudication_test.py"
      - "test/mh8_observed_player_staging_test.py"
      - "test/mh8_roster_reconciliation_test.py"
      - "data/source-evidence/gw8-scout-roster-identities-2026-10-20.json"
      - "data/source-evidence/gw8-reviewed-player-identities-tff-2026-10-20.json"
      - "data/source-evidence/gw8-reviewed-player-identities-tff-prior-lineup-2026-10-20.json"
      - "test/mh8_structured_source_probe_test.py"
      - "test/mh8_source_audit_test.py"
      - "data/source-evidence/gw8-fotmob-match-page-candidates-2026-10-20.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mh8-source-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public HTML parser
        run: python3 -m pip install --disable-pip-version-check beautifulsoup4
      - name: Unit test no-invention source guard
        run: python3 -m unittest discover -s test -p mh8_source_audit_test.py -v
      - name: Read nine match pages and record source availability
        run: |
          set -euo pipefail
          python3 scripts/audit_mh8_fotmob_sources.py --output "$RUNNER_TEMP/mh8-source-audit.json"
          jq -e '.gameweek == 8 and .fixture_pages == 9 and
                 .can_close_gameweek == false and .finalized_player_rows == 0' \
            "$RUNNER_TEMP/mh8-source-audit.json"
          {
            echo "### MH8 observed match-page availability (NOT Fantasy finalization)"
            echo
            jq -r '"- Fulltime pages verified at source: \(.fulltime_pages)/\(.fixture_pages)"' \
              "$RUNNER_TEMP/mh8-source-audit.json"
            echo "- Finalized Fantasy point rows: **0** (intentionally no writes)"
            echo
            jq -r '.results[] | "- Match \(.match_id): \(.page_state)"' \
              "$RUNNER_TEMP/mh8-source-audit.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify structured source parser contracts
        run: python3 -m unittest discover -s test -p mh8_structured_source_probe_test.py -v
      - name: Inspect nine source-backed FotMob matchDetails player records
        run: |
          set -euo pipefail
          python3 scripts/probe_mh8_fotmob_structured.py \
            --output "$RUNNER_TEMP/mh8-structured-source.json"
          jq -e '.gameweek == 8 and .covered_fixtures == 9 and
                 .safe_to_close_gameweek == false and .final_fantasy_rows == 0' \
            "$RUNNER_TEMP/mh8-structured-source.json"
          {
            echo
            echo "### All nine structured player event coverage reports (read only)"
            jq -r '.rows[] | "- Match \(.fixture_id): \(.status), lineups: \(.data.lineup_complete // false), source player stats: \(.data.player_stat_player_count // 0), minutes explicitly sourced: \(.data.explicit_minutes_count // 0), saves explicitly sourced: \(.data.explicit_keeper_save_count // 0), events: \(.data.observed_event_count // 0)"' \
              "$RUNNER_TEMP/mh8-structured-source.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Test strict provider ID to roster mapping
        run: python3 -m unittest discover -s test -p mh8_roster_reconciliation_test.py -v
      - name: Stage provider-to-scout identity links for audit, never finalize
        run: |
          set -euo pipefail
          python3 scripts/reconcile_mh8_provider_players.py \
            --input "$RUNNER_TEMP/mh8-structured-source.json" \
            --output "$RUNNER_TEMP/mh8-scout-identity-audit.json"
          jq -e '.gameweek == 8 and .source_fixtures == 9 and
                 .official_fantasy_points_written == 0 and .safe_to_close_mh8 == false and
                 (.matched_played + .unmatched_played) == .sourced_played' \
            "$RUNNER_TEMP/mh8-scout-identity-audit.json"
          {
            echo
            echo "### Scout player identity coverage (not official Fantasy points)"
            jq -r '"- Matched source-observed players: \(.matched_played)/\(.sourced_played)"' \
              "$RUNNER_TEMP/mh8-scout-identity-audit.json"
            jq -r '.matches[] | "- Fixture \(.match_id): \(.matched_played)/\(.played_observed) linked"' \
              "$RUNNER_TEMP/mh8-scout-identity-audit.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify sourced metric staging contracts
        run: python3 -m unittest discover -s test -p mh8_observed_player_staging_test.py -v
      - name: Stage mapped MH8 player observations without Fantasy point writes
        run: |
          set -euo pipefail
          python3 scripts/stage_mh8_observed_player_metrics.py \
            --input "$RUNNER_TEMP/mh8-scout-identity-audit.json" \
            --output "$RUNNER_TEMP/mh8-observed-player-metrics.json"
          jq -e '.gameweek == 8 and .verified_fixtures == 9 and
                 .official_player_fantasy_points_written == 0 and
                 .ready_to_close == false and
                 (.matched_played + .unmatched_played) > 0' \
            "$RUNNER_TEMP/mh8-observed-player-metrics.json"
          {
            echo
            echo "### Verified source metrics, NOT official Fantasy points"
            jq -r '"- Matched: \(.matched_played); identity review: \(.unmatched_played)"' \
              "$RUNNER_TEMP/mh8-observed-player-metrics.json"
            jq -r '.metric_coverage | to_entries[] | "- \(.key): \(.value) explicitly sourced"' \
              "$RUNNER_TEMP/mh8-observed-player-metrics.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Test MH8 nonfinal event staging contract
        run: python3 -m unittest discover -s test -p mh8_event_adjudication_test.py -v
      - name: Archive source-backed card and penalty review (nonfinal)
        run: |
          set -euo pipefail
          python3 scripts/stage_mh8_event_adjudication.py \
            --structured "$RUNNER_TEMP/mh8-structured-source.json" \
            --identities "$RUNNER_TEMP/mh8-scout-identity-audit.json" \
            --output "$RUNNER_TEMP/mh8-event-review.json"
          jq -e '.gameweek == 8 and .fixtures_verified == 9 and
                 .ready_to_finalize == false and .tff_fantasy_points_written == 0 and
                 .event_counts.Goal == 23 and .event_counts.Card == 31 and
                 .event_counts.MissedPenalty == 1 and .card_colors_verified == false' \
            "$RUNNER_TEMP/mh8-event-review.json"
          {
            echo
            echo "### Nonfinal match event review"
            jq -r '"- Source events: \(.event_counts.Goal) goals, \(.event_counts.Card) cards, \(.event_counts.MissedPenalty) missed penalties"' \
              "$RUNNER_TEMP/mh8-event-review.json"
            jq -r '"- Player mapping requiring review: \(.unmatched_event_identities | length) event records"' \
              "$RUNNER_TEMP/mh8-event-review.json"
            echo "- Card colors, assists and Fantasy bonus: NOT verified"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Test read-only TFF scoring component guard
        run: python3 -m unittest discover -s test -p mh8_point_components_test.py -v
      - name: Stage nonfinal partial MH8 point components
        run: |
          set -euo pipefail
          python3 scripts/stage_mh8_point_components.py \
            --observed "$RUNNER_TEMP/mh8-observed-player-metrics.json" \
            --events "$RUNNER_TEMP/mh8-event-review.json" \
            --output "$RUNNER_TEMP/mh8-nonfinal-scoring-components.json"
          jq -e '.gameweek == 8 and .source_played_count == 286 and
                 .official_points_written == 0 and .ready_to_close == false and
                 ([.rows[].computed_total_fantasy_points] | all(. == null)) and
                 ([.rows[].official_bonus_points] | all(. == null))' \
            "$RUNNER_TEMP/mh8-nonfinal-scoring-components.json"
          {
            echo
            echo "### MH8 incomplete Fantasy score components (not final)"
            echo "- Source-linked player components: 286/286"
            echo "- Bonus, full clean-sheet adjudication, official points: UNVERIFIED"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Archive source evidence and failures for review
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mh8-public-page-source-coverage
          path: |
            ${{ runner.temp }}/mh8-source-audit.json
            ${{ runner.temp }}/mh8-structured-source.json
            ${{ runner.temp }}/mh8-scout-identity-audit.json
            ${{ runner.temp }}/mh8-observed-player-metrics.json
            ${{ runner.temp }}/mh8-event-review.json
            ${{ runner.temp }}/mh8-nonfinal-scoring-components.json
          if-no-files-found: warn
          retention-days: 14
