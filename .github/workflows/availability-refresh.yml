name: Availability refresh

on:
  schedule:
    - cron: '13 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: availability-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FUNCTIONS_URL: https://nnoagjayvrwyjtizhnfz.supabase.co/functions/v1
      OIDC_AUDIENCE: tff-fantezi-scout
    steps:
      - uses: actions/checkout@v4

      - name: Mint GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --show-error --silent \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          token="$(printf '%s' "$response" | jq -er '.value')"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Refresh injuries and suspensions
        id: refresh
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          response="$(curl --fail --show-error --silent --max-time 90 \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            "$FUNCTIONS_URL/refresh-availability")"
          echo "$response" | jq .
          echo "changed=$(printf '%s' "$response" | jq -r '.changed // 0')" >> "$GITHUB_OUTPUT"

      - name: Rebuild model when availability changed
        if: steps.refresh.outputs.changed != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run weekly-model-lifecycle.yml --repo "${{ github.repository }}" --ref main
      - name: Revalidate application cache with signed GitHub OIDC
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --max-time 20 \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tff-fantezi-scout")"
          token="$(printf '%s' "$response" | jq -er '.value')"
          echo "::add-mask::$token"
          curl --fail-with-body --silent --show-error --max-time 45 \
            -X POST -H "Authorization: Bearer $token" \
            -H 'Cache-Control: no-store' \
            https://fanteziligrehberi.com/api/revalidate |
            jq -e '.ok == true and .tag == "scout-run" and .paths_revalidated >= 10'
          echo "Public cache invalidation verified via signed workflow identity."

