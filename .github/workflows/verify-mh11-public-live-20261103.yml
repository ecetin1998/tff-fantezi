name: Verify MH11 public live rendering (one-time)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-mh11-public-live-20261103.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://fanteziligrehberi.com
      EXPECTED_GAMEWEEK: "11"
      EXPECTED_RUN_ID: "754c1985-09fb-4df0-a6eb-812adfad2568"
    steps:
      - uses: actions/checkout@v4
      - name: Verify published API and rendered MH11 across pages
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-published-gameweek.sh
      - name: Verify MH11 active model and 9 fixtures in public API
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 45 -H 'Cache-Control: no-cache' "$BASE_URL/api/scout-data?section=matches&limit=9" |
            jq -e --arg run "$EXPECTED_RUN_ID" '.current_run.gameweek == 11 and .current_run.id == $run and .current_run.is_current == true and .current_run.status == "ready" and (.matches|length) == 9'
