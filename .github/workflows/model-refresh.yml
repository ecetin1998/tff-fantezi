name: Model refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 */6 * * 4-5'

permissions:
  contents: read
  id-token: write

concurrency:
  group: model-refresh
  cancel-in-progress: false

env:
  SUPABASE_FUNCTIONS_URL: https://nnoagjayvrwyjtizhnfz.supabase.co/functions/v1
  OIDC_AUDIENCE: tff-fantezi-scout

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.candidate.outputs.run_id }}
      gameweek: ${{ steps.candidate.outputs.gameweek }}
    steps:
      - uses: actions/checkout@v4

      - name: Acquire GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          token="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Ingest
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          curl -fsS -X POST "$SUPABASE_FUNCTIONS_URL/model-refresh-control"             -H "Authorization: Bearer $OIDC_TOKEN"             -H "Content-Type: application/json"             --data '{"stage":"ingest"}' | tee /tmp/ingest.json

      - name: Candidate run
        id: candidate
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          curl -fsS -X POST "$SUPABASE_FUNCTIONS_URL/model-refresh-control"             -H "Authorization: Bearer $OIDC_TOKEN"             -H "Content-Type: application/json"             --data '{"stage":"candidate"}' > /tmp/candidate.json
          cat /tmp/candidate.json
          echo "run_id=$(python3 -c 'import json; print(json.load(open("/tmp/candidate.json"))["run_id"])')" >> "$GITHUB_OUTPUT"
          echo "gameweek=$(python3 -c 'import json; print(json.load(open("/tmp/candidate.json"))["gameweek"])')" >> "$GITHUB_OUTPUT"

      - name: Candidate optimizer — recommended
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          RUN_ID: ${{ steps.candidate.outputs.run_id }}
        run: |
          curl -fsS "$SUPABASE_FUNCTIONS_URL/run-staging-optimizer?mode=recommended&run=$RUN_ID"             -H "Authorization: Bearer $OIDC_TOKEN"

      - name: Candidate optimizer — alternative
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          RUN_ID: ${{ steps.candidate.outputs.run_id }}
        run: |
          curl -fsS "$SUPABASE_FUNCTIONS_URL/run-staging-optimizer?mode=alternative&run=$RUN_ID"             -H "Authorization: Bearer $OIDC_TOKEN"

      - name: Model QA
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          RUN_ID: ${{ steps.candidate.outputs.run_id }}
        run: |
          payload="$(printf '{"stage":"qa","run_id":"%s"}' "$RUN_ID")"
          curl -fsS -X POST "$SUPABASE_FUNCTIONS_URL/model-refresh-control"             -H "Authorization: Bearer $OIDC_TOKEN"             -H "Content-Type: application/json"             --data "$payload"

      - name: Data integrity QA
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          RUN_ID: ${{ steps.candidate.outputs.run_id }}
        run: |
          payload="$(printf '{"stage":"integrity","run_id":"%s"}' "$RUN_ID")"
          curl -fsS -X POST "$SUPABASE_FUNCTIONS_URL/model-refresh-control"             -H "Authorization: Bearer $OIDC_TOKEN"             -H "Content-Type: application/json"             --data "$payload"

      - name: Replay
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          GW: ${{ steps.candidate.outputs.gameweek }}
        run: |
          replay_gw=$(( GW > 1 ? GW - 1 : 1 ))
          target="scheduled-refresh-${GITHUB_SHA:0:12}"
          curl -fsS "$SUPABASE_FUNCTIONS_URL/run-replay-distribution-test?gw=$replay_gw&draws=50000&target=$target"             -H "Authorization: Bearer $OIDC_TOKEN" | tee /tmp/replay.json

      - name: Record replay PASS
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          RUN_ID: ${{ steps.candidate.outputs.run_id }}
        run: |
          payload="$(jq -c --arg run "$RUN_ID" '{stage:"replay",run_id:$run,pass:true,details:.}' /tmp/replay.json)"
          curl -fsS -X POST "$SUPABASE_FUNCTIONS_URL/model-refresh-control"             -H "Authorization: Bearer $OIDC_TOKEN"             -H "Content-Type: application/json"             --data "$payload"

  promote:
    if: github.event_name == 'workflow_dispatch'
    needs: refresh
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Acquire GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tff-fantezi-scout")"
          token="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Promote candidate
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          RUN_ID: ${{ needs.refresh.outputs.run_id }}
        run: |
          payload="$(printf '{"stage":"promote","run_id":"%s"}' "$RUN_ID")"
          curl -fsS -X POST "https://nnoagjayvrwyjtizhnfz.supabase.co/functions/v1/model-refresh-control"             -H "Authorization: Bearer $OIDC_TOKEN"             -H "Content-Type: application/json"             --data "$payload"
