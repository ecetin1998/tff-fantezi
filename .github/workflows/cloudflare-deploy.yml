name: Cloudflare Workers deploy

# Production remains explicitly initiated by a trusted human command.
# The restricted issue-comment path exists for a single MH8 repair deployment.
on:
  workflow_dispatch:
  issue_comment:
    types: [created]

# Production deploys are explicit. This prevents every tiny main/UI commit from
# rebuilding and bulk-populating the remote KV incremental cache.

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && github.event.issue.number == 266 && github.actor == 'ecetin1998' && github.event.comment.body == '/deploy-mh8-fix') }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SITE_URL: https://fanteziligrehberi.com
      NEXT_PUBLIC_SUPABASE_REDIRECT_URL: https://fanteziligrehberi.com/auth/confirm
      NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
      BASE_URL: https://fanteziligrehberi.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Cloudflare credentials are configured
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Python test dependencies
        run: python3 -m pip install --disable-pip-version-check pytest
      - name: Quality gate
        run: |
          npm run lint
          npm test
      - name: Install Cloudflare build tooling
        run: npm install --no-save --package-lock=false @opennextjs/cloudflare@1.20.6 wrangler@4.142.0 @opentelemetry/api@1.9.1
      - name: Verify R2 incremental cache bucket
        shell: bash
        run: |
          set -euo pipefail
          # Fail safely before deployment if R2 is not enabled/provisioned.
          npx wrangler r2 bucket info tff-fantezi-isr-cache
      - name: Deploy
        run: npm run deploy
      - name: Verify deployed commit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            remote_sha="$(curl -fsSL "$BASE_URL/api/health" | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).sha" || true)"
            if [ "$remote_sha" = "$GITHUB_SHA" ]; then
              echo "Deployed SHA verified: $remote_sha"
              exit 0
            fi
            echo "Waiting for SHA $GITHUB_SHA; live=$remote_sha"
            sleep 5
          done
          exit 1
      - name: Production smoke
        run: SKIP_CDN_CHECK=1 bash scripts/smoke.sh
      - name: Read verified live model week
        id: current_run
        shell: bash
        env:
          FUNCTIONS_URL: https://nnoagjayvrwyjtizhnfz.supabase.co/functions/v1
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tff-fantezi-scout")"
          token="$(printf '%s' "$response" | jq -er '.value')"
          echo "::add-mask::$token"
          response="$(curl --fail-with-body --show-error --silent --max-time 40 \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            --data '{"action":"status"}' "$FUNCTIONS_URL/weekly-model-lifecycle")"
          printf '%s' "$response" | jq -e '.ok == true and .current_gameweek >= 1 and .current_run_id != null'
          echo "gameweek=$(printf '%s' "$response" | jq -er '.current_gameweek')" >> "$GITHUB_OUTPUT"
      - name: Verify site displays current gameweek (not only DB)
        env:
          EXPECTED_GAMEWEEK: ${{ steps.current_run.outputs.gameweek }}
        run: bash scripts/verify-published-gameweek.sh
