name: Cloudflare Workers deploy

on:
  push:
    branches:
      - deploy/cloudflare-current
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-tff-fantezi-current
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_URL: https://tff-fantezi.ecetin1998.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify Cloudflare secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
      - name: Install app dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Cloudflare build tooling
        run: npm install --no-save --package-lock=false @opennextjs/cloudflare@1.20.6 wrangler@4.142.0
      - name: Verify Cloudflare credentials
        run: npx wrangler whoami
      - name: Build for Cloudflare
        run: npx opennextjs-cloudflare build
      - name: Deploy to Cloudflare Workers
        run: npx opennextjs-cloudflare deploy
      - name: Smoke test Cloudflare production
        shell: bash
        run: |
          for attempt in {1..10}; do
            if curl --fail --silent --show-error --location --max-time 30 "$CLOUDFLARE_URL/" >/dev/null; then
              echo "Cloudflare production smoke passed."
              exit 0
            fi
            echo "Smoke attempt $attempt failed; retrying..."
            sleep 5
          done
          exit 1
