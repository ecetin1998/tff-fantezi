name: MH12 one-time authorized tactical production release

# Explicit owner-requested retry; keep standard production workflows manual-only.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mh12-tactical-one-time-release.yml"

permissions:
  contents: read
  actions: write
  pull-requests: write

concurrency:
  group: mh12-tactical-release-request
  cancel-in-progress: false

jobs:
  release:
    if: >-
      startsWith(github.event.head_commit.message, 'chore(release): repair MH12 tactical data')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      PREVIOUS_SHA: df2e40179d16aa723c6d21abda08836703e693dd
      PREVIOUS_MODEL: 411af538-88ed-456b-8279-3a953035a3de
      BASE_URL: https://fanteziligrehberi.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check exact authorized main release
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD^)" = "$PREVIOUS_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
          for workflow in cloudflare-deploy.yml weekly-model-lifecycle.yml; do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow" --jq .state | grep -qx active
          done
          gh pr comment 458 --body "Owner-requested release retry started: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || echo "Status comment unavailable"
      - name: Adopt existing deployment or dispatch production
        shell: bash
        run: |
          set -euo pipefail
          # Let the earlier one-time request finish before considering a retry.
          prior="$(gh run list --workflow mh12-tactical-one-time-release.yml --branch main --limit 20 --json databaseId,status --jq ".[] | select(.databaseId != $GITHUB_RUN_ID and .status != \"completed\") | .databaseId" | head -1)"
          if [[ -n "$prior" ]]; then gh run watch "$prior" --exit-status --interval 10 || true; fi
          active="$(gh run list --workflow cloudflare-deploy.yml --branch main --limit 20 --json databaseId,status --jq '.[] | select(.status != "completed") | .databaseId' | head -1)"
          if [[ -n "$active" ]]; then gh run watch "$active" --exit-status --interval 10 || true; fi
          live_sha="$(curl -fsSL --max-time 30 "$BASE_URL/api/health" | jq -r '.sha' || true)"
          if [[ "$live_sha" != "$PREVIOUS_SHA" && "$live_sha" != "$GITHUB_SHA" ]]; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
            gh workflow run cloudflare-deploy.yml --ref main
            run_id=""
            for attempt in {1..24}; do
              run_id="$(gh run list --workflow cloudflare-deploy.yml --branch main --commit "$GITHUB_SHA" --event workflow_dispatch --limit 5 --json databaseId --jq '.[0].databaseId // empty')"
              if [[ -n "$run_id" ]]; then break; fi
              sleep 5
            done
            test -n "$run_id"
            gh pr comment 458 --body "Production deploy requested: https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id" || echo "Status comment unavailable"
            gh run watch "$run_id" --exit-status --interval 10
            live_sha="$(curl -fsSL --max-time 30 "$BASE_URL/api/health" | jq -er '.sha')"
            test "$live_sha" = "$GITHUB_SHA"
          fi
          gh pr comment 458 --body "Production application SHA verified: $live_sha (contains the MH11 tactical updates)." || echo "Status comment unavailable"
      - name: Adopt or dispatch signed MH12 lifecycle
        shell: bash
        run: |
          set -euo pipefail
          active="$(gh run list --workflow weekly-model-lifecycle.yml --branch main --limit 20 --json databaseId,status --jq '.[] | select(.status != "completed") | .databaseId' | head -1)"
          if [[ -n "$active" ]]; then gh run watch "$active" --exit-status --interval 10 || true; fi
          current="$(curl -fsSL --max-time 40 -H 'Cache-Control: no-cache' "$BASE_URL/api/scout-data?section=matches" | jq -er '.current_run | select(.gameweek==12 and .status=="ready" and .is_current==true) | .id' || true)"
          if [[ -z "$current" || "$current" == "$PREVIOUS_MODEL" ]]; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
            gh workflow run weekly-model-lifecycle.yml --ref main
            run_id=""
            for attempt in {1..24}; do
              run_id="$(gh run list --workflow weekly-model-lifecycle.yml --branch main --commit "$GITHUB_SHA" --event workflow_dispatch --limit 5 --json databaseId --jq '.[0].databaseId // empty')"
              if [[ -n "$run_id" ]]; then break; fi
              sleep 5
            done
            test -n "$run_id"
            gh pr comment 458 --body "MH12 50K lifecycle requested: https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id" || echo "Status comment unavailable"
            gh run watch "$run_id" --exit-status --interval 10
          fi
          # Verify the public current model is NEW, not merely a successful workflow.
          for attempt in {1..12}; do
            current="$(curl -fsSL --max-time 40 -H 'Cache-Control: no-cache' "$BASE_URL/api/scout-data?section=matches" | jq -er '.current_run | select(.gameweek==12 and .status=="ready" and .is_current==true) | .id' || true)"
            if [[ -n "$current" && "$current" != "$PREVIOUS_MODEL" ]]; then
              gh pr comment 458 --body "Verified new active MH12 model on public API: $current. Draw count is validated by the signed lifecycle and Supabase." || echo "Status comment unavailable"
              exit 0
            fi
            sleep 10
          done
          echo "New active model was not independently verified."
          exit 1
      - name: Report failure
        if: failure()
        run: |
          gh pr comment 458 --body "Release retry did not finish verification. Inspect https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID for the exact failed gate." || echo "Status comment unavailable"
