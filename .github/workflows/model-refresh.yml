name: Model refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 */6 * * 4-5"

permissions:
  contents: read
  id-token: write

env:
  SUPABASE_FUNCTIONS_URL: https://nnoagjayvrwyjtizhnfz.supabase.co/functions/v1
  OIDC_AUDIENCE: tff-fantezi-scout

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.candidate.outputs.run_id }}
      gameweek: ${{ steps.candidate.outputs.gameweek }}
    steps:
      - uses: actions/checkout@v4

      - name: Acquire GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          token="$(printf '%s' "$response" | python3 -c 'import json,sys;print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Ingest
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: bash scripts/model-refresh.sh ingest

      - name: Candidate run
        id: candidate
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          bash scripts/model-refresh.sh candidate | tee /tmp/candidate.json
          echo "run_id=$(python3 -c 'import json;print(json.load(open("/tmp/candidate.json"))["run_id"])')" >> "$GITHUB_OUTPUT"
          echo "gameweek=$(python3 -c 'import json;print(json.load(open("/tmp/candidate.json"))["gameweek"])')" >> "$GITHUB_OUTPUT"

      - name: Candidate optimizer
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          RUN_ID: ${{ steps.candidate.outputs.run_id }}
        run: |
          bash scripts/model-refresh.sh optimizer-recommended
          bash scripts/model-refresh.sh optimizer-alternative

      - name: scout_run_qa
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          RUN_ID: ${{ steps.candidate.outputs.run_id }}
        run: bash scripts/model-refresh.sh qa

      - name: scout_data_integrity_qa
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          RUN_ID: ${{ steps.candidate.outputs.run_id }}
        run: bash scripts/model-refresh.sh integrity

      - name: Replay
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          GAMEWEEK: ${{ steps.candidate.outputs.gameweek }}
        run: bash scripts/model-refresh.sh replay | tee /tmp/replay.json

      - name: Record replay gate
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          RUN_ID: ${{ steps.candidate.outputs.run_id }}
          REPLAY_FILE: /tmp/replay.json
        run: bash scripts/model-refresh.sh replay-gate

  promote:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: refresh
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Acquire GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tff-fantezi-scout")"
          token="$(printf '%s' "$response" | python3 -c 'import json,sys;print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Promote candidate
        env:
          SUPABASE_FUNCTIONS_URL: https://nnoagjayvrwyjtizhnfz.supabase.co/functions/v1
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          RUN_ID: ${{ needs.refresh.outputs.run_id }}
        run: bash scripts/model-refresh.sh promote
