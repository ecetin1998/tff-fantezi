name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: https://tff-fantezi.ecetin1998.workers.dev
      SCOUT_OFFLINE_BUILD: '1'
      SCOUT_DATA_API_KEY: runtime-test-key-12345678901234567890
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Python test dependencies
        run: python3 -m pip install --disable-pip-version-check pytest beautifulsoup4
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: MH8 structured player data source tests
        run: python3 -m unittest discover -s test -p mh8_structured_source_probe_test.py -v
      - name: MH8 nonfinal observed player stage tests
        run: python3 -m unittest discover -s test -p mh8_observed_player_staging_test.py -v
      - name: MH8 roster reconciliation safety tests
        run: python3 -m unittest discover -s test -p mh8_roster_reconciliation_test.py -v
      - name: MH8 nonfinal event adjudication contract tests
        run: python3 -m unittest discover -s test -p mh8_event_adjudication_test.py -v
      - name: MH8 guarded nonfinal point components tests
        run: python3 -m unittest discover -s test -p mh8_point_components_test.py -v
      - name: Build
        run: npm run build
      - name: Route runtime
        run: bash scripts/runtime-route-test.sh
