name: Optimizer refresh

on:
  push:
    branches: [main]
    paths:
      - "model/optimizer_rules.py"
      - "model/optimize_candidate.py"
      - "supabase/functions/run-staging-optimizer/**"
      - "supabase/functions/_shared/autosub.ts"
      - ".github/workflows/optimizer-refresh.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: optimizer-refresh-current-run
  cancel-in-progress: true

jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch protected optimizer refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run optimizer-refresh.yml --repo "${{ github.repository }}" --ref main

  optimize:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FUNCTIONS_URL: https://nnoagjayvrwyjtizhnfz.supabase.co/functions/v1
      OIDC_AUDIENCE: tff-fantezi-scout
    steps:
      - name: Mint GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --show-error --silent             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          token="$(printf '%s' "$response" | jq -er '.value')"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Refresh recommended squad
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 300             --header "Authorization: Bearer $OIDC_TOKEN"             "$FUNCTIONS_URL/run-staging-optimizer?mode=recommended"
          echo

      - name: Refresh alternative squad
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 300             --header "Authorization: Bearer $OIDC_TOKEN"             "$FUNCTIONS_URL/run-staging-optimizer?mode=alternative"
          echo
      - name: Revalidate application cache
        if: success()
        env:
          REVALIDATE_SECRET: ${{ secrets.SCOUT_REVALIDATE_SECRET }}
        run: |
          test -n "$REVALIDATE_SECRET"
          curl --fail --show-error --silent -X POST -H "x-revalidate-secret: $REVALIDATE_SECRET" https://fanteziligrehberi.com/api/revalidate
          echo

